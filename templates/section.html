<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{{ section.title }} - {{ config.title }}</title>
    <link rel="alternate" type="application/atom+xml" title="RSS Feed" href="{{ get_url(path="blog/atom.xml") }}" />
    <style>
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, sans-serif;
            line-height: 1.6;
            max-width: 800px;
            margin: 0 auto;
            padding: 20px;
            color: #333;
        }
        h1 { color: #2c3e50; }
        .header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 2em;
        }
        .rss-button {
            display: inline-flex;
            align-items: center;
            gap: 0.5em;
            padding: 0.5em 1em;
            background: #ff6600;
            color: white;
            text-decoration: none;
            border-radius: 4px;
            font-size: 0.9em;
            transition: background 0.2s;
        }
        .rss-button:hover {
            background: #ff8533;
        }
        .rss-icon {
            width: 16px;
            height: 16px;
        }
        .post-list { list-style: none; padding: 0; }
        .post-item {
            margin: 1.5em 0;
            padding: 1em;
            border-left: 3px solid #3498db;
            background: #f8f9fa;
        }
        .post-title {
            font-size: 1.3em;
            margin: 0 0 0.5em 0;
        }
        .post-title a {
            color: #2c3e50;
            text-decoration: none;
        }
        .post-title a:hover {
            color: #3498db;
        }
        .post-meta {
            color: #7f8c8d;
            font-size: 0.9em;
        }
        .post-description {
            margin-top: 0.5em;
            color: #555;
        }
        .back-link {
            display: inline-block;
            margin-top: 2em;
            color: #3498db;
            text-decoration: none;
        }
        .back-link:hover {
            text-decoration: underline;
        }
    </style>
</head>
<body>
    <div class="header">
        <h1>{{ section.title }}</h1>
        <a href="{{ get_url(path="blog/atom.xml") }}" class="rss-button">
            <svg class="rss-icon" viewBox="0 0 24 24" fill="currentColor">
                <path d="M6.18 15.64a2.18 2.18 0 0 1 2.18 2.18C8.36 19 7.38 20 6.18 20C5 20 4 19 4 17.82a2.18 2.18 0 0 1 2.18-2.18M4 4.44A15.56 15.56 0 0 1 19.56 20h-2.83A12.73 12.73 0 0 0 4 7.27V4.44m0 5.66a9.9 9.9 0 0 1 9.9 9.9h-2.83A7.07 7.07 0 0 0 4 12.93V10.1z"/>
            </svg>
            RSS Feed
        </a>
    </div>
    
    <ul class="post-list">
    {% for page in section.pages %}
        <li class="post-item">
            <h3 class="post-title">
                <a href="{{ page.permalink }}">{{ page.title }}</a>
            </h3>
            <div class="post-meta">{{ page.date | date(format="%B %d, %Y") }}</div>
            {% if page.description %}
            <div class="post-description">{{ page.description }}</div>
            {% endif %}
        </li>
    {% endfor %}
    </ul>
    
    <a href="/" class="back-link">← Back to home</a>
</body>
</html>
