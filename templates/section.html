<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{{ section.title }} - {{ config.title }}</title>
    <style>
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, sans-serif;
            line-height: 1.6;
            max-width: 800px;
            margin: 0 auto;
            padding: 20px;
            color: #333;
        }
        h1 { color: #2c3e50; }
        .post-list { list-style: none; padding: 0; }
        .post-item {
            margin: 1.5em 0;
            padding: 1em;
            border-left: 3px solid #3498db;
            background: #f8f9fa;
        }
        .post-title {
            font-size: 1.3em;
            margin: 0 0 0.5em 0;
        }
        .post-title a {
            color: #2c3e50;
            text-decoration: none;
        }
        .post-title a:hover {
            color: #3498db;
        }
        .post-meta {
            color: #7f8c8d;
            font-size: 0.9em;
        }
        .post-description {
            margin-top: 0.5em;
            color: #555;
        }
        .back-link {
            display: inline-block;
            margin-top: 2em;
            color: #3498db;
            text-decoration: none;
        }
        .back-link:hover {
            text-decoration: underline;
        }
    </style>
</head>
<body>
    <h1>{{ section.title }}</h1>
    
    <ul class="post-list">
    {% for page in section.pages %}
        <li class="post-item">
            <h3 class="post-title">
                <a href="{{ page.permalink }}">{{ page.title }}</a>
            </h3>
            <div class="post-meta">{{ page.date | date(format="%B %d, %Y") }}</div>
            {% if page.description %}
            <div class="post-description">{{ page.description }}</div>
            {% endif %}
        </li>
    {% endfor %}
    </ul>
    
    <a href="/" class="back-link">← Back to home</a>
</body>
</html>
